<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iordan Iordanov</title>
    <link rel="icon" href="img/myicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dist/style.css">
</head>
<body>
    <canvas id="diskCanvas"></canvas>
    <div id="terminal">

        <div id="boot">
            <div class="boot-line" data-delay="0">imiordanov.github.io — last updated April 2026</div>
            <div class="boot-line boot-line--hint" data-delay="120">› type a command or click a suggestion below</div>
            <div class="boot-line" data-delay="240" style="color:var(--faint)">────────────────────────────────────────────────</div>
        </div>

        <div id="output"></div>

        <div id="prompt-wrap">
            <div id="prompt-line">
                <span class="prompt-sigil">iordan@tokyo:~$</span>
                <span id="prompt-text"></span>
                <span class="cursor-block" id="promptCursor">█</span>
            </div>
        </div>

        <div id="suggestions">
            <span class="sug-label">try:</span>
            <button class="sug" data-cmd="whoami">whoami</button>
            <button class="sug" data-cmd="man iordan">man iordan</button>
            <button class="sug" data-cmd="ls work/">ls work/</button>
            <button class="sug" data-cmd="ls projects/">ls projects/</button>
            <button class="sug" data-cmd="wget writing">wget writing</button>
            <button class="sug" data-cmd="grep">grep publications</button>
            <button class="sug" data-cmd="ping iordan">ping iordan</button>
            <button class="sug" data-cmd="ls extras/">ls extras/</button>
            <button class="sug" data-cmd="help">help</button>
            <span class="sug-sep"></span>
            <button class="sug" data-cmd="clear">clear</button>
            <a class="sug sug-cv" href="docs/cv-iordanov.pdf" target="_blank">cv ↗</a>
        </div>

        <input id="realInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="terminal input">
    </div>

    <script type="module" src="dist/script.js"></script>
</body>
</html>
